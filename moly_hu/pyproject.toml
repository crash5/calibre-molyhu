[build-system]
requires = ['setuptools>=80', 'setuptools-scm>=8']
build-backend = 'setuptools.build_meta'


[project]
name = 'molyhu'
description = 'Moly.hu metadata scraper'
authors = [
    {name = 'Imre NAGY'},
]

dynamic = ['version']
requires-python = '>=3.8'

[project.optional-dependencies]
dev = ['pytest', 'isort', 'black']

[project.urls]
Homepage = 'https://github.com/crash5/calibre-molyhu'


[tool.flake8]
exclude = ["moly_hu/tests"]
max-line-length = 200
extend-ignore = [
    "E203", # Whitespace before ":"
    "E701"  # Multiple statements on one line
]

[tool.isort]
profile = "black"
src_paths = ["moly_hu/src", "moly_hu/tests", "calibre", "calibre-web"]

[tool.pytest.ini_options]
addopts = [
    "--strict-config",
    "--strict-markers",
    "--showlocals",
    "--quiet",
    "-r A",
    "--import-mode=importlib"
]
testpaths = ["moly_hu/tests"]

